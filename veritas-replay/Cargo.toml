[package]
name = "veritas-replay"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
veritas-dump = { path = "../veritas-dump", features = ["serde"] }
camino = { version = "1.2", features = ["serde1"] }
walkdir = "2.5"

serde = "1.0"
bincode = { version = "2.0.1", features = ["serde"] }
serialport = "4.7"

proc-bitfield = "0.5"