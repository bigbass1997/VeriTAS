[package]
name = "veritas-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
veritas-dump = { version = "0.1", path = "../veritas-dump" }
veritas-emulators = { version = "0.2", path = "../veritas-emulators" }

tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive", "cargo"] }
camino = "1.1"
hex = "0.4"

[[bin]]
name = "veritas"
path = "src/main.rs"
