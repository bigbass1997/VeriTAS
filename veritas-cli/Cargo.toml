[package]
name = "veritas-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
veritas-dump = { version = "0.1", path = "../veritas-dump" }
veritas-emulators = { version = "0.2", path = "../veritas-emulators" }
veritas-replay = { version = "0.1", path = "../veritas-replay" }

tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive", "cargo"] }
camino = { version = "1.2", features = ["serde1"] }
hex = "0.4"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "veritas"
path = "src/main.rs"
