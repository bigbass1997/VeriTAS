[package]
name = "veritas"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
alloc-cortex-m = "0.4"
embedded-hal = { version = "0.2.7", features = ["unproven"] }
fugit = "0.3"

defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

rp2040-pac = "0.6"
rp2040-hal = { version = "0.11", features = ["rt", "critical-section-impl"] }
rp2040-boot2 = "0.3"
pio = "0.2"
pio-proc = "0.2"

heapless = "0.8"
usb-device = "0.3.2"
usbd-serial = "0.2.2"
bincode = { version = "2.0", default-features = false, features = ["alloc", "derive"]}

paste = "1.0"
num_enum = { version = "0.7", default-features = false }

ringbuffer = { version = "0.15", default-features = false }

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
